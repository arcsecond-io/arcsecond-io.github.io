name: Check References

# The command reference and the services/environment reference under
# docs/reference/ are written by the arcsecond tool itself (`arcsecond docs
# commands`, `arcsecond docs compose`). This checks, every six hours and on
# demand, that the committed pages match what the latest release on PyPI
# generates — and goes red when they do not. It changes nothing: regenerating
# and committing is a person's decision, with
#
#   pip install --upgrade arcsecond
#   arcsecond docs commands --out docs/reference/commands
#   arcsecond docs compose --out docs/reference/compose

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the latest released arcsecond tool
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade arcsecond
          arcsecond --version

      - name: The committed references match the release
        run: |
          arcsecond docs commands --check docs/reference/commands
          arcsecond docs compose --check docs/reference/compose
